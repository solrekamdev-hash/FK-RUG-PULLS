<svg xmlns="http://www.w3.org/2000/svg" width="420" height="580" viewBox="0 0 420 580">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="1" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .55 0 0 0 0 .53 0 0 0 0 .5 0 0 0 .9 0"/><feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer></filter>
    <filter id="sheen"><feTurbulence type="fractalNoise" baseFrequency=".012 .02" numOctaves="2" seed="12" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .6 0 0 0 0 .58 0 0 0 0 .53 0 0 0 .5 0"/><feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer></filter>
    <filter id="warp" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="6" result="d"/><feDisplacementMap in="SourceGraphic" in2="d" scale="9"/><feGaussianBlur stdDeviation=".4"/></filter>
    <filter id="warp2" x="-60%" y="-60%" width="220%" height="220%"><feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="20" result="d"/><feDisplacementMap in="SourceGraphic" in2="d" scale="34"/><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="420" height="580" fill="#000" filter="url(#grain)"/>
  <rect width="420" height="580" fill="#000" filter="url(#sheen)"/>
  <circle cx="0" cy="0" r="63" fill="#d8d2c2" opacity=".115" filter="url(#warp2)"/>
  <circle cx="420" cy="0" r="58" fill="#d8d2c2" opacity=".122" filter="url(#warp2)"/>
  <circle cx="0" cy="580" r="50" fill="#d8d2c2" opacity=".144" filter="url(#warp2)"/>
  <circle cx="420" cy="580" r="47" fill="#d8d2c2" opacity=".061" filter="url(#warp2)"/>
  <g fill="none" stroke="#cfc8ba" filter="url(#warp)" stroke-linecap="round">
    <line x1="251" y1="382" x2="340" y2="415" stroke-width="2.5" opacity=".036"/>
    <line x1="240" y1="394" x2="188" y2="500" stroke-width="1.6" opacity=".057"/>
    <line x1="320" y1="272" x2="212" y2="210" stroke-width="1.5" opacity=".058"/>
    <line x1="208" y1="208" x2="288" y2="347" stroke-width="1" opacity=".057"/>
    <line x1="46" y1="397" x2="-65" y2="470" stroke-width="2.3" opacity=".076"/>
